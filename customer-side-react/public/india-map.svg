<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .state-path { 
        fill: #E8DCC8; 
        stroke: #B8A880; 
        stroke-width: 1.5; 
        transition: fill 0.2s ease;
      }
      .state-path:hover { 
        fill: #D4C9A8; 
      }
      .water { 
        fill: #C5D9E8; 
        opacity: 0.3;
      }
    </style>
  </defs>
  
  <!-- Water bodies (Indian Ocean, Bay of Bengal, Arabian Sea) -->
