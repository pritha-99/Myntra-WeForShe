<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4E9E8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="landGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EFE0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DCC8;stop-opacity:1" />
    </linearGradient>
    
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      .state { 
        fill: url(#landGradient);
        stroke: #B8A880; 
        stroke-width: 1; 
        stroke-linejoin: round;
        transition: all 0.3s ease;
      }
      .state:hover { 
        fill: #E8D4A8;
        stroke: #9B7B5A;
        stroke-width: 1.5;
      }
      .water { 
        fill: url(#bgGradient);
      }
      .label {
        font-family: 'Inter', sans-serif;
        font-size: 8px;
        fill: #7A6B52;
        font-weight: 500;
        pointer-events: none;
      }
    </style>
  </defs>
  
  <!-- Background water -->
  <rect class="water" x="0" y="0" width="600" height="800"/>
  
  <!-- Jammu & Kashmir -->
  <path class="state" d="M 200 80 Q 190 70, 210 60 L 230 55 L 250 60 L 270 75 L 280 95 L 275 115 L 260 125 L 240 120 L 220 105 Z" filter="url(#softShadow)"/>
  
  <!-- Himachal Pradesh -->
  <path class="state" d="M 220 130 L 240 125 L 260 130 L 270 145 L 265 160 L 245 165 L 225 160 L 218 145 Z" filter="url(#softShadow)"/>
  
  <!-- Punjab -->
  <path class="state" d="M 180 145 L 200 140 L 220 150 L 225 165 L 215 180 L 195 180 L 175 170 Z" filter="url(#softShadow)"/>
  
  <!-- Uttarakhand -->
